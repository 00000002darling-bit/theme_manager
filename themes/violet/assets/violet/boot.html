<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violet Boot</title>
<style>
/* ==========================================================================
   dsh-violet-boot — 薇尔莉特主题开机动画（样式层）
   由 host 插件在 index.html 的 <head> 中注入，早于首帧渲染。
   只依赖 DSH 稳定的两个数据属性（[data-dsh-boot] / [data-dsh-boot-spinner]），
   不依赖任何被 hash 过的类名，因此 DSH 小版本升级不会失效。
   主题照片由 lib/index.js 读成 base64 后替换掉下面的照片占位符（见 .ve-photo）。
   注意：本文件里那个占位符字符串只能出现一次，否则会被替换多次、白白放大注入体积。

   画面：纯白底、人物居中。背景只留极淡的暖色暗角、缓慢旋转的光柱、浮尘与飘散的信，
   真实加载进度表现为画像下方那条细细的暖金光线，加载完成时右下角盖一枚火漆印。
   ========================================================================== */

/* --- 1. 屏蔽原生 boot 遮罩的外观，但保留它的 DOM 用于读取真实进度 --- */
html:not(.ve-release) [data-dsh-boot] {
  background: transparent !important;
}
html:not(.ve-release) [data-dsh-boot] > * {
  visibility: hidden !important;
}

/* --- 2. 舞台根节点：一张白纸 --- */
#ve-boot {
  --ve-progress: 0;
  --ve-gold: #c9a45c;
  --ve-gold-soft: rgba(201, 164, 92, 0.55);
  --ve-ink: #2b2318;
  --ve-ink-soft: rgba(70, 58, 38, 0.62);
  position: fixed;
  inset: 0;
  z-index: 2147483000;
  overflow: hidden;
  /* 独立组：画像的 multiply 只跟这层白底相乘，页面外的东西不会漏进来 */
  isolation: isolate;
  display: grid;
  place-items: center;
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia,
    "Songti SC", "Noto Serif CJK SC", "Microsoft YaHei", serif;
  color: var(--ve-ink);
  background: #ffffff;
  opacity: 0;
  /* 0.3s 渐显 */
  transition: opacity 300ms ease;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
  -webkit-user-select: none;
  cursor: default;
}
#ve-boot.ve-in {
  opacity: 1;
}
#ve-boot.ve-out {
  opacity: 0;
  transition: opacity 620ms cubic-bezier(0.45, 0, 0.85, 1);
  pointer-events: none;
}

/* --- 3. 背景层：暖色暗角 / 光柱 / 浮尘 / 飘散的信 ---
   全部画在画像之下、且都很淡：白纸上只该看见人物。 */
.ve-vig {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    122% 100% at 50% 44%,
    rgba(255, 255, 255, 0) 44%,
    rgba(178, 158, 112, 0.07) 100%
  );
  pointer-events: none;
}
.ve-rays {
  position: absolute;
  inset: -45%;
  background: repeating-conic-gradient(
    from 0deg at 50% 50%,
    rgba(190, 166, 110, 0.03) 0deg,
    rgba(190, 166, 110, 0.03) 2.6deg,
    transparent 9deg,
    transparent 17deg,
    rgba(150, 172, 206, 0.018) 19.5deg,
    rgba(150, 172, 206, 0.018) 21deg,
    transparent 27deg,
    transparent 40deg
  );
  /* 中心留白：光柱不要汇聚成一个亮点。 */
  -webkit-mask-image: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.1) 0%, #000 34%, #000 100%);
  mask-image: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.1) 0%, #000 34%, #000 100%);
  /* 白底上“光”是加不出来的，所以改用 multiply 让光柱成为极淡的阴影 */
  mix-blend-mode: multiply;
  animation: ve-spin 190s linear infinite;
  pointer-events: none;
}
.ve-motes,
.ve-letters {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.ve-mote {
  position: absolute;
  left: var(--x);
  top: var(--y);
  width: var(--s);
  height: var(--s);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(198, 168, 106, 0.6), rgba(198, 168, 106, 0) 70%);
  opacity: 0;
  animation: ve-mote var(--dur) ease-in-out var(--delay) infinite;
}
.ve-letter {
  position: absolute;
  left: var(--x);
  bottom: -6%;
  width: 18px;
  height: 12px;
  border: 1px solid rgba(186, 158, 102, 0.42);
  border-radius: 2px;
  opacity: 0;
  animation: ve-letter var(--dur) linear var(--delay) infinite;
}
.ve-letter::before,
.ve-letter::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 1px;
  background: rgba(186, 158, 102, 0.38);
  transform-origin: 0 0;
}
.ve-letter::before {
  transform: rotate(33deg);
  width: 62%;
}
.ve-letter::after {
  left: auto;
  right: 0;
  transform-origin: 100% 0;
  transform: rotate(-33deg);
  width: 62%;
}

/* --- 4. 舞台 ---
   刻意不给 z-index：一旦它成为层叠上下文，画像的 multiply 就只能跟组内空白相乘，
   白底会重新变成一块可见的方块。靠 DOM 顺序压住背景层就够了。 */
.ve-stage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
/* 人物身后的柔光。白底上加不了光，所以用一层极淡的暖色做“被灯照着”的感觉 */
.ve-bloom {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(820px, 92vw);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  background: radial-gradient(
    circle,
    rgba(226, 196, 132, 0.15) 0%,
    rgba(222, 196, 148, 0.055) 42%,
    rgba(226, 196, 132, 0) 70%
  );
  mix-blend-mode: multiply;
  filter: blur(6px);
  pointer-events: none;
}

/* --- 5. 人像：唯一的画面主体，居中、不裁切 --- */
.ve-portrait {
  position: relative;
  height: min(58vh, 560px);
  /* 与素材 739x760 同比：contain 之下不裁切、不拉伸 */
  aspect-ratio: 739 / 760;
  overflow: hidden;
}

  /* 略放大一点，好让 ve-drift 有左右巡游的余地；多出来的边全是白底，看不见 */
  background-size: auto 104%;
  background-position: 50% 46%;
  background-repeat: no-repeat;
  /* multiply：照片底色已被拉到纯白，混合结果就等于白纸本身——
     于是画面上只有人，没有那块照片的方形白底。
     注意：这个元素与白底之间不能有带 transform / filter / opacity 的祖先，
     那种祖先会自成隔离组，multiply 就只跟组内的空白相乘，方块会重新露出来。 */
  mix-blend-mode: multiply;
  opacity: 0;
  transform: scale(1.045);
  filter: blur(12px) sepia(0.1) saturate(0.98) contrast(1.01);
  transition: opacity 900ms ease, transform 1600ms cubic-bezier(0.2, 0.7, 0.2, 1),
    filter 1400ms ease;
  /* 极缓的呼吸：静止的画像也在“活着”，但看不出在动 */
  animation: ve-drift 18s ease-in-out infinite alternate;
}
#ve-boot.ve-in .ve-photo {
  opacity: 1;
  transform: scale(1);
  filter: blur(0px) sepia(0.06) saturate(1.04) contrast(1.02);
}

/* --- 6. 书写区（默认为空：wordmark / subtitle 留空时这两个节点根本不渲染） --- */
.ve-typedrow {
  display: flex;
  align-items: flex-end;
  min-height: 42px;
  margin-top: 26px;
  font-size: clamp(21px, 3vw, 31px);
  font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--ve-ink);
  transition: transform 90ms ease;
}
/* 每敲下一个字，整行轻轻一顿——替代原来打字机键帽的触感 */
.ve-typedrow.ve-strike {
  transform: translateY(1.3px);
}
.ve-typed {
  white-space: pre;
}
.ve-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 3px;
  background: #3a2c14;
  animation: ve-blink 1.02s steps(1, end) infinite;
}

/* --- 7. 桌面光线 = 真实加载进度 --- */
.ve-desk {
  position: relative;
  width: min(560px, 66vw);
  height: 1px;
  margin-top: 34px;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(120, 101, 60, 0.16) 10%,
    rgba(120, 101, 60, 0.16) 90%,
    transparent
  );
}
.ve-deskfill {
  position: absolute;
  inset: 0;
  transform-origin: left center;
  transform: scaleX(var(--ve-progress));
  background: linear-gradient(90deg, rgba(214, 178, 110, 0.55), var(--ve-gold) 55%, #b98f3e);
  box-shadow: 0 0 12px rgba(201, 164, 92, 0.5);
}
.ve-deskhead {
  position: absolute;
  top: 50%;
  left: calc(var(--ve-progress) * 100%);
  width: 5px;
  height: 5px;
  margin: -2.5px 0 0 -2.5px;
  border-radius: 50%;
  background: #b98f3e;
  box-shadow: 0 0 10px 3px rgba(201, 164, 92, 0.55);
  opacity: clamp(0, calc(var(--ve-progress) * 12), 1);
}

/* --- 8. 文案 --- */
.ve-caption {
  margin-top: 22px;
  font-size: clamp(11px, 1.2vw, 14px);
  letter-spacing: 0.32em;
  color: var(--ve-ink-soft);
}
.ve-hintline {
  margin-top: 12px;
  display: flex;
  align-items: baseline;
  gap: 10px;
  font-family: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: rgba(96, 86, 70, 0.6);
}
.ve-pct {
  font-variant-numeric: tabular-nums;
  color: rgba(160, 118, 42, 0.9);
  min-width: 3.2em;
  text-align: right;
}

/* --- 9. 火漆印：加载完成时盖在右下角（不打扰居中的人物） --- */
.ve-seal {
  position: absolute;
  right: 40px;
  bottom: 34px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 36% 27%, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0) 27%),
    radial-gradient(circle at 34% 30%, #d7664f, #a5352a 62%, #7d2419 100%);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.3) inset,
    0 0 0 2px rgba(140, 44, 32, 0.2),
    0 3px 10px rgba(90, 60, 40, 0.22);
  opacity: 0;
  transform: scale(0.4) rotate(-14deg);
  transition: opacity 260ms ease, transform 320ms cubic-bezier(0.34, 1.56, 0.64, 1);
}
.ve-seal::before {
  /* 压制边缘的锯齿压痕 */
  content: "";
  position: absolute;
  inset: 2.5px;
  border-radius: 50%;
  border: 2px dotted rgba(255, 220, 198, 0.34);
}
.ve-seal::after {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  border: 1px solid rgba(255, 232, 214, 0.6);
}
#ve-boot.ve-sealed .ve-seal {
  opacity: 1;
  transform: scale(1) rotate(-6deg);
}

/* --- 10. 收尾光扫 --- */
.ve-sweep {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0;
  background: linear-gradient(
    100deg,
    transparent 34%,
    rgba(226, 190, 120, 0.16) 44%,
    rgba(255, 250, 232, 0.9) 50%,
    rgba(226, 190, 120, 0.16) 56%,
    transparent 66%
  );
}
#ve-boot.ve-out .ve-sweep {
  opacity: 1;
  animation: ve-sweep 700ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
}

/* --- 11. 关键帧 --- */
@keyframes ve-spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes ve-blink {
  0%,
  49% {
    opacity: 1;
  }
  50%,
  100% {
    opacity: 0;
  }
}
@keyframes ve-mote {
  0% {
    opacity: 0;
    transform: translate3d(0, 12px, 0) scale(0.7);
  }
  30% {
    opacity: 0.55;
  }
  100% {
    opacity: 0;
    transform: translate3d(var(--dx), -86px, 0) scale(1.1);
  }
}
@keyframes ve-letter {
  0% {
    opacity: 0;
    transform: translate3d(0, 0, 0) rotate(var(--rot));
  }
  12% {
    opacity: 0.42;
  }
  88% {
    opacity: 0.28;
  }
  100% {
    opacity: 0;
    transform: translate3d(var(--dx), calc(-102vh), 0) rotate(calc(var(--rot) + 26deg));
  }
}
@keyframes ve-sweep {
  0% {
    transform: translate3d(-120%, 0, 0);
  }
  100% {
    transform: translate3d(120%, 0, 0);
  }
}
/* 极缓的呼吸：换 background-position 而不是 transform——transform 会让元素
   自成隔离组，multiply 就会失效（见 .ve-photo 的注释）。 */
@keyframes ve-drift {
  from {
    background-position: 50% 43%;
  }
  to {
    background-position: 50% 49%;
  }
}

/* --- 12. 自适应与降级 ---
   注意：这里一律不去 transform 祖先（缩放画像尺寸就够了），
   否则会破坏画像的 multiply。 */
@media (max-height: 680px) {
  .ve-portrait {
    height: min(52vh, 420px);
  }
  .ve-desk {
    margin-top: 22px;
  }
  .ve-caption {
    margin-top: 14px;
  }
}
@media (max-height: 560px) {
  .ve-portrait {
    height: min(48vh, 320px);
  }
}
@media (max-width: 520px) {
  .ve-portrait {
    height: min(50vh, 380px);
  }
  .ve-typedrow {
    font-size: clamp(19px, 6.4vw, 27px);
  }
  .ve-desk {
    width: 88vw;
  }
  .ve-seal {
    right: 20px;
    bottom: 20px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .ve-rays,
  .ve-mote,
  .ve-letter,
  .ve-caret,
  .ve-photo {
    animation: none !important;
  }
  .ve-mote,
  .ve-letter {
    opacity: 0.24;
  }
  /* 保留“显影”这一步，但去掉模糊与缩放，只留一次快速淡入 */
  .ve-photo,
  #ve-boot.ve-in .ve-photo {
    filter: none !important;
    transform: none !important;
    transition: opacity 400ms ease !important;
  }
  #ve-boot.ve-out .ve-sweep {
    animation: none;
    opacity: 0;
  }
}

</style>

<body>
<div data-dsh-boot></div>
<div data-dsh-boot-spinner style="--dsh-boot-arc: 72deg"></div>
<script>
(function () {
  var boot = document.querySelector('[data-dsh-boot]');
  var el = document.querySelector('[data-dsh-boot-spinner]');
  if (!el) return;
  var T = 1800, t0 = Date.now();
  /* 进度渲染用 rAF; 收尾用定时器 —— 不受 rAF 节流影响, 弹框时机确定 */
  function tick() {
    var p = Math.min(1, (Date.now() - t0) / T);
    el.style.setProperty('--dsh-boot-arc', (72 + p * 216).toFixed(1) + 'deg');
    if (p < 1) requestAnimationFrame(tick);
  }
  tick();
  /* 播完即弹: T 到点(1800ms 动画播完) -> 移除遮罩+动画根节点, 并立即发播完通知(不依赖原生 finish) */
  setTimeout(function () {
    if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
    var r = document.querySelector('.ve-root');
    if (r && r.parentNode) { try { r.style.transition = 'none'; } catch (e) {} r.parentNode.removeChild(r); }
    try { window.parent.postMessage('violet-done', '*'); } catch (e) {}
  }, T);
})();
</script>
<script>
window.__VIOLET_BOOT__ = {
  seal: new URLSearchParams(location.search).get('seal') === '1',
  minDurationMs: 1200,
  outroMs: 280,
  sweepMs: 260
};
</script>
<script>
/* ==========================================================================
   dsh-violet-boot — 薇尔莉特主题开机动画（行为层）
   作为内联 classic script 注入在 <body> 开头之后，因此先于 shell 的 module
   脚本执行：我们自己搭舞台，同时把原生 boot 遮罩当作“真实进度 + 结束信号”
   的传感器来用。
   结束条件（任一满足即收尾，绝不停留）：
     1) 用户点击 / 按键（可关闭）
     2) 原生遮罩曾出现且已消失，且已达到最短播放时长  → 应用已挂载
     3) 达到最长播放时长（兜底，避免永久遮挡界面）
   本文件作为内联脚本注入，因此整个文件里不得出现脚本闭合标签的字面量
   （写成 "<" + "/script" 也不行——校验是纯字符串匹配）。
   ========================================================================== */
(function () {
  "use strict";
  if (window.__veBoot && window.__veBoot.version) return;

  var DEFAULTS = {
    minDurationMs: 2500,
    maxDurationMs: 20000,
    outroMs: 760,
    sweepMs: 700,
    skippable: true,
    wordmark: "",
    subtitle: "",
    seal: false,
    hint: "Loading plugins…",
    typedCharMs: 135,
    letters: 12,
    motes: 26
  };

  var cfg = {};
  var given = window.__VIOLET_BOOT__ || {};
  for (var k in DEFAULTS) {
    if (Object.prototype.hasOwnProperty.call(DEFAULTS, k)) {
      cfg[k] = given[k] === undefined || given[k] === null ? DEFAULTS[k] : given[k];
    }
  }

  /* 尊重系统的“减弱动效”：不剥夺这段开场，但把它压到最短，不让人被迫等。 */
  var reduceMotion = false;
  try {
    reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  } catch (e) {
    reduceMotion = false;
  }
  if (reduceMotion) cfg.minDurationMs = Math.min(cfg.minDurationMs, 900);

  /* 0.1.x 的主角是一台手绘打字机（SVG），0.2.x 是一张“人像信笺”。
     0.3.0 起回到那张照片本身的样子：纯白底、人物居中，其余什么都不加。
     0.4.0 的画面没变，只是同一个插件又给使用界面铺了一层画像底纹（wallpaper.css）。
     版面文案默认不出现（画面干净优先）；把 wordmark / subtitle 配成非空字符串
     就会把「逐字敲出的字样」和「副标题」加回来，排在画像下方。 */
  var typedMarkup = cfg.wordmark
    ? '<div class="ve-typedrow"><span class="ve-typed"></span><span class="ve-caret"></span></div>'
    : "";
  var captionMarkup = cfg.subtitle ? '<div class="ve-caption"><span class="ve-sub"></span></div>' : "";
  /* 火漆印：加载完成时盖在右下角；seal: false 就完全不出现。 */
  var sealMarkup = cfg.seal === false ? "" : '<div class="ve-seal"></div>';

  var MARKUP =
    '<div class="ve-vig"></div>' +
    '<div class="ve-rays"></div>' +
    '<div class="ve-motes"></div>' +
    '<div class="ve-letters"></div>' +
    '<div class="ve-stage">' +
    '<div class="ve-bloom"></div>' +
    '<div class="ve-portrait">' +
    '<div class="ve-photo" role="img" aria-label="Violet Evergarden"></div>' +
    "</div>" +
    typedMarkup +
    '<div class="ve-desk"><i class="ve-deskfill"></i><i class="ve-deskhead"></i></div>' +
    captionMarkup +
    '<div class="ve-hintline"><span class="ve-hinttext"></span><span class="ve-pct"></span></div>' +
    "</div>" +
    sealMarkup +
    '<div class="ve-sweep"></div>';

  var startedAt = Date.now();
  var root = null;
  var typedEl = null;
  var pctEl = null;
  var typedRow = null;
  var typed = 0;
  var shown = 0;
  var target = 0;
  var frozen = false;
  var finished = false;
  var finishedAt = 0;
  var released = false;
  var sawOverlay = false;
  var skipRequested = false;
  var rafId = 0;
  var tickId = 0;
  var overlayObserver = null;
  var failSeen = false;

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function stockOverlay() {
    return document.querySelector("[data-dsh-boot]");
  }

  /** 应用是否已经挂载出内容——没有原生遮罩时的“加载完成”判据。 */
  function appMounted() {
    var host = document.getElementById("root");
    if (host && host.childElementCount > 0) return true;
    return false;
  }

  /* 原生遮罩的生命周期可能短于一帧取样间隔，用观察器把它“看见过”这件事锁死，
     否则快速加载时我们会误判成“遮罩从未出现”而不必要地多挡 20 秒。 */
  function watchOverlay() {
    if (typeof window.MutationObserver !== "function") return null;
    var observer = new window.MutationObserver(function () {
      if (!sawOverlay && stockOverlay()) sawOverlay = true;
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
    if (stockOverlay()) sawOverlay = true;
    return observer;
  }

  /** 原生遮罩上的环形进度 → 0..1。72deg 起步，满值 288deg。 */
  function readProgress() {
    var spinner = document.querySelector("[data-dsh-boot-spinner]");
    if (!spinner) return null;
    var raw = spinner.style.getPropertyValue("--dsh-boot-arc");
    if (!raw) raw = window.getComputedStyle(spinner).getPropertyValue("--dsh-boot-arc");
    var deg = parseFloat(raw);
    if (!isFinite(deg)) return null;
    var p = (deg - 72) / 216;
    return p < 0 ? 0 : p > 1 ? 1 : p;
  }

  function spawnDecor() {
    var motes = root.querySelector(".ve-motes");
    var html = "";
    for (var i = 0; i < cfg.motes; i += 1) {
      html +=
        '<i class="ve-mote" style="--x:' +
        rand(4, 96).toFixed(2) +
        "%;--y:" +
        rand(28, 92).toFixed(2) +
        "%;--s:" +
        rand(1.6, 3.4).toFixed(1) +
        "px;--dx:" +
        rand(-26, 26).toFixed(0) +
        "px;--dur:" +
        rand(7, 15).toFixed(1) +
        "s;--delay:" +
        rand(0, 9).toFixed(1) +
        's"></i>';
    }
    motes.innerHTML = html;

    var letters = root.querySelector(".ve-letters");
    html = "";
    for (var j = 0; j < cfg.letters; j += 1) {
      html +=
        '<i class="ve-letter" style="--x:' +
        rand(6, 94).toFixed(2) +
        "%;--dx:" +
        rand(-60, 60).toFixed(0) +
        "px;--rot:" +
        rand(-22, 22).toFixed(0) +
        "deg;--dur:" +
        rand(16, 30).toFixed(1) +
        "s;--delay:" +
        rand(0, 14).toFixed(1) +
        's"></i>';
    }
    letters.innerHTML = html;
  }

  function mount() {
    root = document.createElement("div");
    root.id = "ve-boot";
    root.setAttribute("data-ve-boot", "");
    root.setAttribute("aria-hidden", "true");
    root.innerHTML = MARKUP;
    document.body.appendChild(root);

    typedEl = root.querySelector(".ve-typed");
    typedRow = root.querySelector(".ve-typedrow");
    pctEl = root.querySelector(".ve-pct");
    var sub = root.querySelector(".ve-sub");
    var hintText = root.querySelector(".ve-hinttext");
    if (sub) sub.textContent = cfg.subtitle;
    if (hintText) hintText.textContent = cfg.hint;

    spawnDecor();
    render();
    overlayObserver = watchOverlay();
    /* 淡入必须在“下一个可绘制帧”发生，但 rAF 在窗口隐藏/后台、以及无头截图的
       虚拟时间里会被节流甚至完全停摆——那样遮罩会一直停在 opacity 0，用户看到的
       是一片白（原生遮罩已被我们藏起来了）。所以定时器兜底一次，幂等。 */
    var shown = false;
    var showOnce = function () {
      if (shown || !root) return;
      shown = true;
      root.classList.add("ve-in");
    };
    window.requestAnimationFrame(showOnce);
    window.setTimeout(showOnce, 60);

    if (cfg.skippable) {
      var _tapT = 0, _tapX = 0, _tapY = 0;
      window.addEventListener("pointerup", function (e) {
        var now = Date.now(), dx = (e.clientX || 0) - _tapX, dy = (e.clientY || 0) - _tapY, dt = now - _tapT;
        _tapT = now; _tapX = e.clientX || 0; _tapY = e.clientY || 0;
        if (dt > 0 && dt < 350 && Math.abs(dx) < 80 && Math.abs(dy) < 80) onSkip(e);
      }, true);
      window.addEventListener("keydown", onSkip, true);
      window.addEventListener("wheel", onSkip, { capture: true, passive: true });
    }

    /* 不依赖 rAF 的兜底计时器：即使窗口被隐藏、rAF 被节流，也一定会收尾。 */
    window.setTimeout(function () {
      if (!finished) finish("timeout");
    }, cfg.maxDurationMs);

    window.requestAnimationFrame(loop);
    /* rAF 只在窗口可见且被合成时才跑；后台/隐藏窗口会被节流甚至停摆。
       补一个低频滴答，保证状态机（打字、进度、收尾判定）照常推进。 */
    tickId = window.setInterval(function () {
      if (finished || frozen) {
        window.clearInterval(tickId);
        tickId = 0;
        return;
      }
      loop(true);
    }, 120);
  }

  function onSkip() {
    if (finished) return;
    skipRequested = true;
    finish("skipped");
  }

  /* 每敲下一个字，整行轻轻一顿——替代原来打字机键帽的触感。 */
  function pulseStrike() {
    if (!typedRow) return;
    typedRow.classList.add("ve-strike");
    window.setTimeout(function () {
      typedRow.classList.remove("ve-strike");
    }, 110);
  }

  function render() {
    if (!root || !root.isConnected) return;
    root.style.setProperty("--ve-progress", shown.toFixed(4));
    if (pctEl) pctEl.textContent = Math.round(shown * 100) + "%";
    /* 火漆印 = “信写完了”。门限刻意留早一点：真实加载往往在最后一刻才冲到 100%，
       卡在 0.985 会让印章只闪一帧；0.84 之后它就有足够时间被看见。 */
    if (shown > 0.4) root.classList.add("ve-sealed");
    else root.classList.remove("ve-sealed");
  }

  function loop(fromTimer) {
    if (frozen || finished) return;
    var now = Date.now();
    var elapsed = now - startedAt;

    /* 打字机：按时间逐字打出品牌名，与加载进度解耦，读起来更自然。 */
    var wantChars = Math.min(cfg.wordmark.length, Math.floor(elapsed / cfg.typedCharMs) + 1);
    if (wantChars > typed) {
      typed = wantChars;
      if (typedEl) typedEl.textContent = cfg.wordmark.slice(0, typed);
      pulseStrike();
    }

    var el = stockOverlay();
    if (el) {
      sawOverlay = true;
      var real = readProgress();
      if (real !== null) target = real;
      if (!failSeen && el.textContent && el.textContent.indexOf("Failed to load") >= 0) {
        failSeen = true;
      }
    } else if (sawOverlay) {
      target = Math.max(target, 0.985);
    }

    /* 缓动跟随，避免进度跳变；结束时另由 finish() 拉满。 */
    if (!finished) shown += (target - shown) * 0.14;
    render();
    considerFinish(elapsed, el);
    if (!fromTimer) rafId = window.requestAnimationFrame(loop);
  }

  function considerFinish(elapsed, el) {
    if (finished) return;
    if (skipRequested) return finish("skipped");
    if (failSeen) return finish("failed");
    if (elapsed >= cfg.maxDurationMs) return finish("timeout");
    if (sawOverlay && !el && elapsed >= cfg.minDurationMs) return finish("mounted");
    /* 兜底：万一这版 DSH 的遮罩我们始终没认出来，只要应用已经挂载出内容，
       并且已过最短时长，就不要继续挡着用户。 */
    if (!sawOverlay && elapsed >= cfg.minDurationMs && appMounted()) return finish("mounted");
  }

    function finish(reason) {
    try { window.parent.postMessage('violet-done', '*'); } catch (e) {}

    if (finished) return;
    finished = true;
    finishedAt = Date.now();
    if (rafId) {
      window.cancelAnimationFrame(rafId);
      rafId = 0;
    }
    if (tickId) {
      window.clearInterval(tickId);
      tickId = 0;
    }
    target = 1;

    /* 无论何种原因结束，都先把进度拉满再收尾——除超时/失败，那两种情况优先让位。 */
    var graceful = reason === "mounted" || reason === "skipped" || reason === "manual";
    var holdMs = graceful ? 380 : 0;
    var ramp = window.setInterval(function () {
      shown += (1 - shown) * 0.32;
      if (graceful) render();
      if (shown > 0.995) {
        window.clearInterval(ramp);
      }
    }, 32);

    window.setTimeout(function () {
      window.clearInterval(ramp);
      if (graceful) {
        shown = 1;
        render();
      }
      root.classList.add("ve-out");
      release();
      window.setTimeout(teardown, cfg.outroMs);
    }, holdMs);
  }

  /** 交还控制权：让原生 boot 遮罩（含失败列表）重新可见。 */
  function release() {
    if (released) return;
    released = true;
    document.documentElement.classList.add("ve-release");
  }

  function teardown() {
    if (root && root.parentNode) root.parentNode.removeChild(root);
    root = null;
    if (overlayObserver) {
      overlayObserver.disconnect();
      overlayObserver = null;
    }
    window.removeEventListener("pointerdown", onSkip, true);
    window.removeEventListener("keydown", onSkip, true);
    window.removeEventListener("wheel", onSkip, true);
    if (window.__veBoot) window.__veBoot.done = true;
  }

  window.__veBoot = {
    version: "0.4.0",
    role: "boot-cinematic",
    config: cfg,
    skip: onSkip,
    release: function () {
      finish("manual");
    },
    /** 预览用：冻结在时间轴 t 毫秒处的画面。 */
    seek: function (ms, phase) {
      frozen = true;
      if (rafId) {
        window.cancelAnimationFrame(rafId);
        rafId = 0;
      }
      var el = stockOverlay();
      if (el) sawOverlay = true;
      var real = readProgress();
      target = real === null ? (el ? 0.35 : 0.985) : real;
      shown = target;
      typed = Math.min(cfg.wordmark.length, Math.floor(ms / cfg.typedCharMs) + 1);
      if (typedEl) typedEl.textContent = cfg.wordmark.slice(0, typed);
      if (phase === "outro") root.classList.add("ve-out");
      render();
    },
    state: function () {
      return {
        elapsed: Date.now() - startedAt,
        typed: typed,
        shown: Math.round(shown * 1000) / 1000,
        finished: finished,
        released: released,
        sawOverlay: sawOverlay
      };
    }
  };

  if (document.body) mount();
  else document.addEventListener("DOMContentLoaded", mount, { once: true });
})();

</script>
</body>
</html>
